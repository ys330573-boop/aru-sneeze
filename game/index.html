<!doctype html>
<meta charset="utf-8">
<!-- THE DOOR, AND IT IS NOT A PAGE. One game: the picture book in story/ plays
     and runs straight into the board in game.html (?start=1, so no cover comes
     between them). This file exists only because Vercel serves a matching
     static file BEFORE it consults a rewrite - /index.html matched, so a
     vercel.json rewrite of / could never fire. It paints nothing: no text, no
     link, no flash. location.replace leaves no history entry either, so Back
     from the board goes where the child came from and never lands here. -->
<title>आरु की छींक</title>
<style>html,body{margin:0;height:100%;background:#f3dcc0}</style>
<script>location.replace('story/index.html' + location.search + location.hash);</script>
<noscript><meta http-equiv="refresh" content="0; url=story/index.html"></noscript>
